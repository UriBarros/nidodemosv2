services:
  api:
    build: .
    image: gtrifood:latest
    container_name: gtrifood-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    command:
      [
        "uvicorn",
        "gtrifood.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: gtrifood:latest
    container_name: gtrifood-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "scripts/run_poller.py"]
