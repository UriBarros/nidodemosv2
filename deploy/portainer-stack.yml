# =============================================================================
# gtrifood — stack Docker Swarm pra Portainer + Traefik
#
# Routing:
#   gtrifood.aceleradoragtr.cloud/         → Next.js (web)
#   gtrifood.aceleradoragtr.cloud/api      → FastAPI (api)
# =============================================================================
version: "3.8"

services:
  api:
    image: ghcr.io/uribarros/nidodemosv2:sha-44e7bd1
    environment:
      IFOOD_CLIENT_ID: ${IFOOD_CLIENT_ID}
      IFOOD_CLIENT_SECRET: ${IFOOD_CLIENT_SECRET}
      IFOOD_BASE_URL: ${IFOOD_BASE_URL:-https://merchant-api.ifood.com.br}
      IFOOD_AUTH_URL: ${IFOOD_AUTH_URL:-https://merchant-api.ifood.com.br/authentication/v1.0/oauth/token}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_ROOT_PATH: /api
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command:
      - uvicorn
      - gtrifood.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --root-path=/api
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      update_config: { order: start-first }
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.gtrifood-api.rule=Host(`gtrifood.aceleradoragtr.cloud`) && PathPrefix(`/api`)"
        - "traefik.http.routers.gtrifood-api.entrypoints=websecure"
        - "traefik.http.routers.gtrifood-api.tls=true"
        - "traefik.http.routers.gtrifood-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.gtrifood-api.priority=20"
        - "traefik.http.middlewares.gtrifood-api-strip.stripprefix.prefixes=/api"
        - "traefik.http.routers.gtrifood-api.middlewares=gtrifood-api-strip"
        - "traefik.http.services.gtrifood-api.loadbalancer.server.port=8000"

  worker:
    image: ghcr.io/uribarros/nidodemosv2:sha-44e7bd1
    environment:
      IFOOD_CLIENT_ID: ${IFOOD_CLIENT_ID}
      IFOOD_CLIENT_SECRET: ${IFOOD_CLIENT_SECRET}
      IFOOD_BASE_URL: ${IFOOD_BASE_URL:-https://merchant-api.ifood.com.br}
      IFOOD_AUTH_URL: ${IFOOD_AUTH_URL:-https://merchant-api.ifood.com.br/authentication/v1.0/oauth/token}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["python", "scripts/run_poller.py"]
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 10s }

  web:
    image: ghcr.io/uribarros/nidodemosv2-web:sha-44e7bd1
    environment:
      NODE_ENV: production
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      update_config: { order: start-first }
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.gtrifood-web.rule=Host(`gtrifood.aceleradoragtr.cloud`)"
        - "traefik.http.routers.gtrifood-web.entrypoints=websecure"
        - "traefik.http.routers.gtrifood-web.tls=true"
        - "traefik.http.routers.gtrifood-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.gtrifood-web.priority=1"
        - "traefik.http.services.gtrifood-web.loadbalancer.server.port=3000"

networks:
  network_public:
    external: true
